<p-toast></p-toast>
<p-confirmDialog></p-confirmDialog>

<div class="p-6 bg-slate-50 dark:bg-zinc-950 min-h-screen">
  <div class="flex justify-between items-center mb-6">
    <div>
      <h1 class="text-2xl font-bold text-slate-800">User Management</h1>
      <p class="text-sm text-slate-500">Manage global identity, cross-cutting scopes, and system permissions.</p>
    </div>
    <button pButton label="Add Access Provider" icon="pi pi-user-plus" class="p-button-primary shadow-md" (click)="openNew()"></button>
  </div>

  <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
    <p-table [value]="users()" [loading]="loading()" [paginator]="true" [rows]="10" styleClass="p-datatable-sm text-sm">
      <ng-template pTemplate="header">
        <tr class="bg-slate-100 text-slate-700">
          <th>Identity Details</th>
          <th>System Scope mapping</th>
          <th>System Status</th>
          <th class="text-center">Execution Controls</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-user>
        <tr class="hover:bg-slate-50 transition">
          <td>
            <div class="font-semibold text-slate-900">{{user.fullName}}</div>
            <div class="text-xs text-slate-400">&#64;{{user.username}} &middot; {{user.email}}</div>
          </td>
          <td>
            <div class="flex flex-wrap gap-1">
              <span *ngFor="let r of user.roles" class="inline-flex items-center gap-1">
                <p-tag [severity]="getSeverity(r.scopeType)" [value]="r.role"></p-tag>
                <small class="text-slate-500 text-xs bg-slate-100 rounded px-1 font-mono">
                  [{{r.scopeType}}: {{r.scopeId || 'Global'}}]
                </small>
              </span>
            </div>
          </td>
          <td>
            <!--p-toggleButton [ngModel]="user.active" (onChange)="toggleStatus(user)" 
                            onLabel="Active" offLabel="Suspended" 
                            onIcon="pi pi-check" offIcon="pi pi-times" 
                            styleClass="p-button-sm">
            </p-toggleButton-->
          </td>
          <td>
            <div class="flex justify-center gap-2">
              <button pButton icon="pi pi-user-edit" class="p-button-text p-button-sm p-button-info" (click)="openEdit(user)"></button>
              <button pButton icon="pi pi-trash" class="p-button-text p-button-sm p-button-danger" (click)="deleteUser(user)"></button>
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>

<p-dialog [(visible)]="displayDialog" [modal]="true" [header]="selectedUser() ? 'Modify Access Rights' : 'Provision Access Matrix'" [style]="{width: '55vw'}" styleClass="p-fluid">
  <ng-template pTemplate="content">
    <form [formGroup]="userForm" class="flex flex-col gap-4 pt-2">
      
      <div class="grid grid-cols-2 gap-4">
        <div class="flex flex-col gap-1">
          <label class="text-xs font-semibold text-slate-600">Account Username</label>
          <input pInputText formControlName="username" class="w-full" />
        </div>
        <div class="flex flex-col gap-1">
          <label class="text-xs font-semibold text-slate-600">Full Name</label>
          <input pInputText formControlName="fullName" class="w-full" />
        </div>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div class="flex flex-col gap-1">
          <label class="text-xs font-semibold text-slate-600">Secure Email Address</label>
          <input pInputText type="email" formControlName="email" class="w-full" />
        </div>
        <div class="flex flex-col gap-1">
          <label class="text-xs font-semibold text-slate-600">Primary Institution Identifier</label>
          <input pInputText formControlName="institutionId" class="w-full" placeholder="Optional core entity mapping" />
        </div>
      </div>

      <hr class="border-slate-200 my-2">

      <div class="flex justify-between items-center">
        <h3 class="text-sm font-bold text-slate-700 uppercase tracking-wider">Assigned Identity Scopes & Roles Matrix</h3>
        <button pButton type="button" icon="pi pi-plus" label="Append Matrix Definition" class="p-button-outlined p-button-sm w-auto" (click)="addRoleField()"></button>
      </div>

      <div formArrayName="roles" class="flex flex-col gap-3 max-h-64 overflow-y-auto pr-1">
        <div *ngFor="let roleGroup of rolesFormArray.controls; let i=index" [formGroupName]="i" 
             class="flex items-center gap-3 bg-slate-50 border border-slate-200 p-3 rounded-lg relative">
          
          <div class="flex-1 grid grid-cols-3 gap-3">
            <div class="flex flex-col gap-1">
              <label class="text-[10px] font-bold text-slate-500 uppercase">System Role</label>
              <!--p-dropdown [options]="rolesOptions" formControlName="role" placeholder="Select Role"></p-dropdown-->  
            </div>
            
            <div class="flex flex-col gap-1">
              <label class="text-[10px] font-bold text-slate-500 uppercase">Context Boundary Scope</label>
              <!--p-dropdown [options]="scopeOptions" formControlName="scopeType" placeholder="Select Scope"></p-dropdown-->
            </div>

            <div class="flex flex-col gap-1">
              <label class="text-[10px] font-bold text-slate-500 uppercase">Boundary Scope Target Target ID</label>
              <input pInputText formControlName="scopeId" placeholder="District ID / Inst. ID" 
                     [disabled]="roleGroup.get('scopeType')?.value === 'PDHS'"/>
            </div>
          </div>

          <button pButton type="button" icon="pi pi-minus-circle" class="p-button-danger p-button-text self-end mb-1" 
                  [disabled]="rolesFormArray.length === 1" (click)="removeRoleField(i)"></button>
        </div>
      </div>
    </form>
  </ng-template>

  <ng-template pTemplate="footer">
    <button pButton label="Discard" icon="pi pi-times" class="p-button-text" (click)="displayDialog.set(false)"></button>
    <button pButton label="Enforce Context Policies" icon="pi pi-save" class="p-button-primary" [disabled]="userForm.invalid" (click)="saveUser()"></button>
  </ng-template>
</p-dialog>
